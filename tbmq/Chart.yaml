apiVersion: v2
appVersion: 2.4.0
description: Helm chart for TBMQ cluster (Community and Professional Editions).
name: tbmq-cluster
type: application
version: 2.3.0
annotations:
  artifacthub.io/category: streaming-messaging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/maintainers: |
    - name: dshvaika
      email: dshvaika@thingsboard.io
    - name: dlandiak
      email: dlandiak@thingsboard.io
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "Removed the `helm.sh/hook-timeout` annotation from the install Pod and upgrade Job. Helm does not support it, so the documented 300s/600s hook timeouts never applied: Helm waits for hooks only as long as `--timeout` (default 5m). The README now tells you to pass `--timeout 10m` on install and a `--timeout` that covers your migration on upgrade."
    - kind: added
      description: "`installation.activeDeadlineSeconds` (default 600) and `upgrade.activeDeadlineSeconds` (default 3600) set a hard limit on the install Pod and the migration Job. Before, a failing install Pod or a migration stuck waiting for PostgreSQL kept running after Helm gave up."
    - kind: fixed
      description: "`upgrade.argocd: true` now renders the migration Job. ArgoCD renders with `helm template`, where the release is never an upgrade, so the Job was always skipped."
    - kind: changed
      description: "README reorganized for first-time users: every helm command now passes `-n <namespace>`, the PE edits and the PostgreSQL/Kafka/Redis settings moved into Step 2, a single install command, new \"Access TBMQ\" and \"Troubleshooting the Install\" sections, an upgrade procedure that updates the image tags before running `helm upgrade`, and an ArgoCD section."
home: https://tbmq.io/
icon: https://img.thingsboard.io/thingsboard_blue.svg
keywords:
  - tbmq
  - mqtt
  - broker
  - thingsboard
  - iot
