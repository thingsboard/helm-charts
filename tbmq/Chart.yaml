apiVersion: v2
appVersion: 2.4.1
description: Helm chart for TBMQ cluster (Community and Professional Editions).
name: tbmq-cluster
type: application
version: 2.3.1
annotations:
  artifacthub.io/category: streaming-messaging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/maintainers: |
    - name: dshvaika
      email: dshvaika@thingsboard.io
    - name: dlandiak
      email: dlandiak@thingsboard.io
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: "Bumped TBMQ to 2.4.1 (CE images: 2.4.1; PE images: 2.4.1PE). No chart value or ConfigMap changes are required: every key the chart sets is still supported by TBMQ 2.4.1, and the new 2.4.1 settings (node drain `NODE_DRAIN_*`, REST publish `REST_PUBLISH_*`) have application defaults and can be tuned via tbmq.customEnv."
    - kind: changed
      description: "Heads-up for TBMQ 2.4.1 upgrades: `MQTT_TOPIC_MAX_SEGMENTS_COUNT` now counts topic segments instead of `/` delimiters. If you set it in tbmq.customEnv, raise it by 1 to keep the previous limit; the default `0` (no limit) is unaffected. See the TBMQ 2.4.1 release notes at https://tbmq.io/docs/releases/."
home: https://tbmq.io/
icon: https://img.thingsboard.io/thingsboard_blue.svg
keywords:
  - tbmq
  - mqtt
  - broker
  - thingsboard
  - iot
