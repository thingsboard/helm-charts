apiVersion: v2
appVersion: 2.4.0
description: Helm chart for TBMQ cluster (Community and Professional Editions).
name: tbmq-cluster
type: application
version: 2.1.1
annotations:
  artifacthub.io/category: streaming-messaging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/maintainers: |
    - name: dshvaika
      email: dshvaika@thingsboard.io
    - name: dlandiak
      email: dlandiak@thingsboard.io
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "Declared the chart license with the supported `artifacthub.io/license` annotation. The previous `licenses` key is not an Artifact Hub annotation, so the package page showed no license at all."
    - kind: added
      description: "The chart's own helper images are now configurable via `helperImages.toolbox` and `helperImages.busybox`. They were hardcoded in the templates, which made the chart unusable with a private registry or an air-gapped mirror."
    - kind: changed
      description: "Bumped the helper images to current releases: thingsboard/toolbox 1.13.0 -> 1.29.0 and busybox 1.36 -> 1.37.0. Both are drop-in — the toolbox script contract (script-runner.sh / psql-validator.sh under WORKDIR /scripts) is unchanged."
    - kind: fixed
      description: "Corrected the Minikube guide's description of the install Pod delete policy: it is `hook-succeeded,before-hook-creation`, so a FAILED install Pod is retained for inspection and only removed before the next hook run."
    - kind: added
      description: "Minikube guide: added an MQTT smoke test. TBMQ 2.4.0 enables the MQTT_BASIC auth provider with no credentials, so a fresh deployment refuses every client with CONNECTION_REFUSED_NOT_AUTHORIZED until credentials are created."
home: https://tbmq.io/
icon: https://img.thingsboard.io/thingsboard_blue.svg
keywords:
  - tbmq
  - mqtt
  - broker
  - thingsboard
  - iot
