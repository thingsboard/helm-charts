apiVersion: v2
appVersion: 2.4.0
description: Helm chart for TBMQ cluster (Community and Professional Editions).
name: tbmq-cluster
type: application
version: 2.3.0
annotations:
  artifacthub.io/category: streaming-messaging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/maintainers: |
    - name: dshvaika
      email: dshvaika@thingsboard.io
    - name: dlandiak
      email: dlandiak@thingsboard.io
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "Removed the `helm.sh/hook-timeout` annotation from the install Pod and upgrade Job. Helm does not support it, so the documented 300s/600s hook timeouts never applied: Helm waits for hooks only as long as `--timeout` (default 5m). Hooks have always been limited by that 5m default, so the new install Pod and migration Job deadlines (below) stay under it and neither command needs `--timeout`. If you raise a deadline, the README tells you to pass a longer `--timeout`."
    - kind: added
      description: "`installation.activeDeadlineSeconds` (default 240) and `upgrade.activeDeadlineSeconds` (default 240) set a hard limit on the install Pod and the migration Job. Before, a failing install Pod or a migration stuck waiting for PostgreSQL kept running after Helm gave up."
    - kind: fixed
      description: "`upgrade.argocd: true` now renders the migration Job. ArgoCD renders with `helm template`, where the release is never an upgrade, so the Job was always skipped. ArgoCD users: remove any persisted `upgrade.upgradeDbSchema: true` from the Application values before syncing 2.3.0. It used to have no effect; now it runs a PreSync migration on every sync, which fails with `database already upgraded to current version` on the same TBMQ version and blocks the sync. Never set it on a first sync either: its Pod is stuck on ConfigMaps and Secrets the Sync phase has not created yet (Init:0/1 with FailedMount for the default ConfigMaps, CreateContainerConfigError with existingConfigMap), until `upgrade.activeDeadlineSeconds` runs out."
    - kind: fixed
      description: "With `installation.argocd: true`, the install Pod's ArgoCD delete policy is now `BeforeHookCreation,HookSucceeded`. With `HookSucceeded` alone, a failed install Pod was never replaced, so a retry sync after fixing the values did not re-run the install until the Pod was deleted by hand."
    - kind: changed
      description: "README reorganized for first-time users: every helm command now passes `-n <namespace>`, the PE edits and the PostgreSQL/Kafka/Redis settings moved into Step 2, a single install command, new \"Access TBMQ\" and \"Troubleshooting the Install\" sections, an upgrade procedure that updates the image tags before running `helm upgrade`, and an ArgoCD section."
home: https://tbmq.io/
icon: https://img.thingsboard.io/thingsboard_blue.svg
keywords:
  - tbmq
  - mqtt
  - broker
  - thingsboard
  - iot
