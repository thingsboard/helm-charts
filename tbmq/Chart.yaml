apiVersion: v2
appVersion: 2.4.0
description: Helm chart for TBMQ cluster (Community and Professional Editions).
name: tbmq-cluster
type: application
version: 2.2.0
annotations:
  artifacthub.io/category: streaming-messaging
  licenses: Apache-2.0
  artifacthub.io/maintainers: |
    - name: dshvaika
      email: dshvaika@thingsboard.io
    - name: dlandiak
      email: dlandiak@thingsboard.io
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "tbmq.priorityClassName and tbmq-ie.priorityClassName set a PriorityClass on the broker and Integration Executor StatefulSets (optional, unset by default)."
    - kind: added
      description: "loadbalancer.mqtt.mutualTls.existingSecretName loads the MQTT TLS server certificate and private key (server.pem, mqttserver_key.pem) from an existing Secret instead of a ConfigMap. When set, it takes precedence over configMapName."
home: https://tbmq.io/
icon: https://img.thingsboard.io/thingsboard_blue.svg
keywords:
  - tbmq
  - mqtt
  - broker
  - thingsboard
  - iot
