apiVersion: v1
entries:
  tbmq-cluster:
  - annotations:
      artifacthub.io/category: streaming-messaging
      artifacthub.io/changes: |
        - kind: fixed
          description: "Removed the `helm.sh/hook-timeout` annotation from the install Pod and upgrade Job. Helm does not support it, so the documented 300s/600s hook timeouts never applied: Helm waits for hooks only as long as `--timeout` (default 5m). Hooks have always been limited by that 5m default, so the new install Pod and migration Job deadlines (below) stay under it and neither command needs `--timeout`. If you raise a deadline, the README tells you to pass a longer `--timeout`."
        - kind: added
          description: "`installation.activeDeadlineSeconds` (default 240) and `upgrade.activeDeadlineSeconds` (default 240) set a hard limit on the install Pod and the migration Job. Before, a failing install Pod or a migration stuck waiting for PostgreSQL kept running after Helm gave up. An install or migration that runs longer than the limit (for example because of slow image pulls) is now stopped: raise the value and pass a longer `--timeout`."
        - kind: fixed
          description: "`upgrade.argocd: true` now renders the migration Job. ArgoCD renders with `helm template`, where the release is never an upgrade, so the Job was always skipped. ArgoCD users: remove any persisted `upgrade.upgradeDbSchema: true` from the Application values before syncing 2.3.0. It used to have no effect; now it runs a PreSync migration on every sync, which fails with `database already upgraded to current version` on the same TBMQ version and blocks the sync. Never set it on a first sync either: its Pod is stuck on ConfigMaps and Secrets the Sync phase has not created yet (Init:0/1 with FailedMount for the default ConfigMaps, CreateContainerConfigError with existingConfigMap), until `upgrade.activeDeadlineSeconds` runs out."
        - kind: fixed
          description: "With `installation.argocd: true`, the install Pod's ArgoCD delete policy is now `BeforeHookCreation,HookSucceeded`. With `HookSucceeded` alone, a failed install Pod was never replaced, so a retry sync after fixing the values did not re-run the install until the Pod was deleted by hand."
        - kind: changed
          description: "README reorganized for first-time users: every helm command now passes `-n <namespace>`, the PE edits and the PostgreSQL/Kafka/Redis settings moved into Step 2, a single install command, new \"Access TBMQ\" and \"Troubleshooting the Install\" sections, an upgrade procedure that updates the image tags before running `helm upgrade`, and an ArgoCD section. Troubleshooting now matches what Kubernetes actually does: how to read a failed install Pod's logs, that a migration Job hitting its deadline loses its Pods and logs, and that a leftover `upgrade.fromVersion=ce` fails the next PE version upgrade with `transitioning from CE to PE requires the database to first be upgraded`."
        - kind: fixed
          description: "Minikube guide: the PostgreSQL readiness wait also matched PGO's backup Job Pod, which ends as Completed and never becomes Ready, so the wait could time out. It now waits only for the database Pod. The CE → PE step now scales the broker and Integration Executor to 0 before the upgrade and checks the license activation afterwards."
      artifacthub.io/license: Apache-2.0
      artifacthub.io/maintainers: |
        - name: dshvaika
          email: dshvaika@thingsboard.io
        - name: dlandiak
          email: dlandiak@thingsboard.io
      artifacthub.io/prerelease: "false"
    apiVersion: v2
    appVersion: 2.4.0
    created: "2026-09-24T14:53:30.314619477+03:00"
    description: Helm chart for TBMQ cluster (Community and Professional Editions).
    digest: 554e19d9c1d484e5bddc67680cd77f911ee2a64f5aecc0b0d3a6c5b99994596e
    home: https://tbmq.io/
    icon: https://img.thingsboard.io/thingsboard_blue.svg
    keywords:
    - tbmq
    - mqtt
    - broker
    - thingsboard
    - iot
    name: tbmq-cluster
    type: application
    urls:
    - https://helm.thingsboard.io/tbmq/tbmq-cluster-2.3.0.tgz
    version: 2.3.0
  - annotations:
      artifacthub.io/category: streaming-messaging
      artifacthub.io/changes: |
        - kind: added
          description: "tbmq.priorityClassName and tbmq-ie.priorityClassName set a PriorityClass on the broker and Integration Executor StatefulSets (optional, unset by default)."
        - kind: added
          description: "loadbalancer.mqtt.mutualTls.existingSecretName loads the MQTT TLS server certificate and private key (server.pem, mqttserver_key.pem) from an existing Secret instead of a ConfigMap. When set, it takes precedence over configMapName."
        - kind: changed
          description: "Upgrading from chart 2.1.0: TBMQ stays at 2.4.0, so there is no database migration. Run a plain `helm upgrade` without scaling down and without `upgrade.upgradeDbSchema=true`. Setting the flag makes the pre-upgrade Job fail with `database already upgraded to current version`. The README's Standard Upgrade Procedure now says when the flag applies."
        - kind: added
          description: "The chart's own helper images are now configurable via `helperImages.toolbox` and `helperImages.busybox`. They were hardcoded in the templates, which made the chart unusable with a private registry or an air-gapped mirror."
        - kind: changed
          description: "Bumped the helper images to current releases: thingsboard/toolbox 1.13.0 -> 1.29.0 and busybox 1.36 -> 1.37.0. Both are drop-in — the toolbox script contract (script-runner.sh / psql-validator.sh under WORKDIR /scripts) is unchanged."
        - kind: fixed
          description: "Declared the chart license with the supported `artifacthub.io/license` annotation. The previous `licenses` key is not an Artifact Hub annotation, so the package page showed no license at all."
        - kind: fixed
          description: "Corrected the Minikube guide's install Pod note: with `restartPolicy: OnFailure` a failed install does not stop, it keeps retrying in CrashLoopBackOff. The guide now says to read the failed attempt with `kubectl logs --previous` and delete the Pod afterwards."
        - kind: added
          description: "Minikube guide: added an MQTT smoke test. It uses the built-in tbmq_websockets_username credential (created at install, no password), and explains that MQTT_BASIC is the only auth provider enabled by default, so a client sending no username at all is rejected with CONNECTION_REFUSED_NOT_AUTHORIZED."
      artifacthub.io/license: Apache-2.0
      artifacthub.io/maintainers: |
        - name: dshvaika
          email: dshvaika@thingsboard.io
        - name: dlandiak
          email: dlandiak@thingsboard.io
      artifacthub.io/prerelease: "false"
