{{- if and .Values.redis.usePassword (empty .Values.redis.existingSecret) -}}
{{- $namespace := .Release.Namespace -}}
{{- $releaseName := .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $releaseName }}-redis-secret
  namespace: {{ $namespace }}
type: Opaque
data:
  redis-password: {{ .Values.redis.password | b64enc }}
{{- end }}
