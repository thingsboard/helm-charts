{{- $namespace := .Release.Namespace -}}
{{- $releaseName := .Release.Name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $releaseName }}-tbmq-custom-env
  namespace: {{ $namespace }}
  labels:
    name: {{ $releaseName }}-tbmq-custom-env
data: {{ if not .Values.tbmq.customEnv }}{}{{ end }}
  {{- range $key, $val := .Values.tbmq.customEnv }}
  {{ $key }}: {{ tpl (toString $val) $ | quote }}
  {{- end }}
