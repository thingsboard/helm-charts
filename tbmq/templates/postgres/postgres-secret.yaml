{{- if empty .Values.postgresql.existingSecret }}
{{- $namespace := .Release.Namespace -}}
{{- $releaseName := .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $releaseName }}-postgres-secret
  namespace: {{ $namespace }}
type: Opaque
data:
  postgres-password: {{ .Values.postgresql.password | b64enc }}
{{- end }}
